<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" width="100%" height="620">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </linearGradient>

    <!-- Holographic Border Gradient -->
    <linearGradient id="holo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Lanyard Gradient -->
    <linearGradient id="lanyard-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- ═════════ LANYARD STRAP & CLIP ═════════ -->
  <!-- Top Ribbon hanging down -->
  <path d="M 195,0 L 210,65 L 250,65 L 265,0 Z" fill="url(#lanyard-ribbon)"/>
  <!-- Metallic Ring / Clip -->
  <rect x="215" y="60" width="30" height="15" rx="3" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="222" y="73" width="16" height="18" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Badge Slot Hole in Card -->
  <rect x="200" y="105" width="60" height="10" rx="5" fill="#020617" stroke="#334155" stroke-width="1"/>

  <!-- ═════════ MAIN BADGE CARD ═════════ -->
  <g transform="translate(20, 90)">
