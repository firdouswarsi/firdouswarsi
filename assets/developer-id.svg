      DEVELOPER ID // ACCESS: LEVEL 3
    </text>
    <circle cx="385" cy="36" r="4" fill="#10b981" filter="url(#badge-glow)"/>
    <text class="font-mono" x="375" y="40" text-anchor="end" font-size="10" font-weight="700" fill="#10b981">
      ACTIVE
    </text>

    <!-- Photo Avatar Frame -->
    <g transform="translate(30, 85)">
