    <rect x="2" y="2" width="416" height="516" rx="20" fill="none" stroke="url(#holo-border)" stroke-width="2.5" filter="url(#badge-glow)"/>
    <rect x="2" y="2" width="416" height="516" rx="20" fill="url(#card-glass)"/>

    <!-- Header Banner -->
