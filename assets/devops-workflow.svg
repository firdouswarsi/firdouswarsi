<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030817"/>
      <stop offset="50%" stop-color="#06132e"/>
      <stop offset="100%" stop-color="#020611"/>
    </linearGradient>

    <!-- Pipeline Tube Gradient -->
    <linearGradient id="tube-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#167cff"/>
      <stop offset="50%" stop-color="#35d9ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Holographic Card Gradient -->
    <linearGradient id="card-holo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#092553" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#02091b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="wf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes flow-dash {
      to { stroke-dashoffset: -32; }
    }
    .flow-stream {
      stroke-dasharray: 8, 4;
      animation: flow-dash 1.2s linear infinite;
    }
    .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Container Box with Holographic Border -->
  <rect x="2" y="2" width="1156" height="216" rx="16" fill="url(#wf-bg)" stroke="#39cfff" stroke-width="1.2"/>
  <rect x="6" y="6" width="1148" height="208" rx="12" fill="none" stroke="#46caff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Top Title HUD -->
  <g transform="translate(24, 26)">
    <text class="font-mono" x="0" y="0" font-size="11" font-weight="700" fill="#35d9ff" letter-spacing="2">
      // END-TO-END DEVOPS DELIVERY PIPELINE
    </text>
    <text class="font-mono" x="650" y="0" font-size="10" font-weight="600" fill="#9edfff">
      AUTOMATED LIFECYCLE: CODE ➔ ARTIFACT ➔ CLOUD INFRASTRUCTURE ➔ PRODUCTION
    </text>
  </g>

  <!-- Central Flow Rail Tube -->
  <line x1="45" y1="100" x2="1115" y2="100" stroke="#167cff" stroke-opacity="0.4" stroke-width="6" stroke-linecap="round"/>
  <line x1="45" y1="100" x2="1115" y2="100" class="flow-stream" stroke="url(#tube-grad)" stroke-width="3" filter="url(#wf-glow)"/>

  <!-- ═════════ 10 PIPELINE STAGE CARDS ═════════ -->

  <!-- STAGE 1: CODE -->
  <g transform="translate(35, 55)">
    <rect x="0" y="0" width="95" height="90" rx="8" fill="url(#card-holo)" stroke="#35d9ff" stroke-width="1"/>
    <circle cx="47.5" cy="22" r="14" fill="#04152c" stroke="#35d9ff" stroke-width="1"/>
    <text x="47.5" y="26" text-anchor="middle" font-size="12">💻</text>
    <text class="font-sans" x="47.5" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">CODE</text>
    <text class="font-mono" x="47.5" y="67" text-anchor="middle" font-size="8.5" font-weight="600" fill="#9edfff">VS Code</text>
    <rect x="12" y="73" width="71" height="12" rx="3" fill="#167cff" fill-opacity="0.25"/>
    <text class="font-mono" x="47.5" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#35d9ff">IDE DEV</text>
  </g>

  <!-- STAGE 2: GIT -->
  <g transform="translate(145, 55)">
    <rect x="0" y="0" width="95" height="90" rx="8" fill="url(#card-holo)" stroke="#f05032" stroke-width="1"/>
    <circle cx="47.5" cy="22" r="14" fill="#04152c" stroke="#f05032" stroke-width="1"/>
    <text x="47.5" y="26" text-anchor="middle" font-size="12">🌿</text>
    <text class="font-sans" x="47.5" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">GIT</text>
    <text class="font-mono" x="47.5" y="67" text-anchor="middle" font-size="8.5" font-weight="600" fill="#fca5a5">Git VCS</text>
    <rect x="12" y="73" width="71" height="12" rx="3" fill="#f05032" fill-opacity="0.25"/>
    <text class="font-mono" x="47.5" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fca5a5">VERSION</text>
  </g>

  <!-- STAGE 3: BUILD -->
  <g transform="translate(255, 55)">
    <rect x="0" y="0" width="95" height="90" rx="8" fill="url(#card-holo)" stroke="#0078d7" stroke-width="1"/>
    <circle cx="47.5" cy="22" r="14" fill="#04152c" stroke="#0078d7" stroke-width="1"/>
    <text x="47.5" y="26" text-anchor="middle" font-size="12">⚙️</text>
    <text class="font-sans" x="47.5" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">BUILD</text>
    <text class="font-mono" x="47.5" y="67" text-anchor="middle" font-size="8.5" font-weight="600" fill="#93c5fd">Azure / Jenk</text>
    <rect x="12" y="73" width="71" height="12" rx="3" fill="#0078d7" fill-opacity="0.25"/>
    <text class="font-mono" x="47.5" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#93c5fd">CI AUTOM</text>
  </g>

  <!-- STAGE 4: TEST -->
  <g transform="translate(365, 55)">
    <rect x="0" y="0" width="95" height="90" rx="8" fill="url(#card-holo)" stroke="#00c7b7" stroke-width="1"/>
    <circle cx="47.5" cy="22" r="14" fill="#04152c" stroke="#00c7b7" stroke-width="1"/>
    <text x="47.5" y="26" text-anchor="middle" font-size="12">🛡️</text>
    <text class="font-sans" x="47.5" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">TEST</text>
    <text class="font-mono" x="47.5" y="67" text-anchor="middle" font-size="8.5" font-weight="600" fill="#5eead4">Sonar / Trivy</text>
    <rect x="12" y="73" width="71" height="12" rx="3" fill="#00c7b7" fill-opacity="0.25"/>
    <text class="font-mono" x="47.5" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5eead4">SEC GATE</text>
  </g>

  <!-- STAGE 5: DOCKER (BASIC KNOWLEDGE) -->
  <g transform="translate(475, 55)">
    <rect x="0" y="0" width="105" height="90" rx="8" fill="url(#card-holo)" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="52.5" cy="22" r="14" fill="#04152c" stroke="#38bdf8" stroke-width="1"/>
    <text x="52.5" y="26" text-anchor="middle" font-size="12">🐳</text>
    <text class="font-sans" x="52.5" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">DOCKER</text>
    <text class="font-mono" x="52.5" y="67" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7dd3fc">Containers</text>
    <rect x="8" y="73" width="89" height="12" rx="3" fill="#f59e0b" fill-opacity="0.2"/>
    <text class="font-mono" x="52.5" y="82" text-anchor="middle" font-size="7" font-weight="700" fill="#fcd34d">BASIC KNOW</text>
  </g>

  <!-- STAGE 6: KUBERNETES (BASIC KNOWLEDGE) -->
  <g transform="translate(595, 55)">
    <rect x="0" y="0" width="105" height="90" rx="8" fill="url(#card-holo)" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="52.5" cy="22" r="14" fill="#04152c" stroke="#60a5fa" stroke-width="1"/>
    <text x="52.5" y="26" text-anchor="middle" font-size="12">☸️</text>
    <text class="font-sans" x="52.5" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">K8S (AKS)</text>
    <text class="font-mono" x="52.5" y="67" text-anchor="middle" font-size="8.5" font-weight="600" fill="#bfdbfe">Clusters</text>
    <rect x="8" y="73" width="89" height="12" rx="3" fill="#f59e0b" fill-opacity="0.2"/>
    <text class="font-mono" x="52.5" y="82" text-anchor="middle" font-size="7" font-weight="700" fill="#fcd34d">BASIC KNOW</text>
  </g>

  <!-- STAGE 7: TERRAFORM (PRIMARY) -->
  <g transform="translate(715, 55)">
    <rect x="0" y="0" width="105" height="90" rx="8" fill="url(#card-holo)" stroke="#a855f7" stroke-width="1.8" filter="url(#wf-glow)"/>
    <circle cx="52.5" cy="22" r="14" fill="#04152c" stroke="#c084fc" stroke-width="1.5"/>
    <text x="52.5" y="26" text-anchor="middle" font-size="12">⚡</text>
    <text class="font-sans" x="52.5" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">TERRAFORM</text>
    <text class="font-mono" x="52.5" y="67" text-anchor="middle" font-size="8.5" font-weight="600" fill="#e9d5ff">IaC Modules</text>
    <rect x="8" y="73" width="89" height="12" rx="3" fill="#a855f7" fill-opacity="0.3"/>
    <text class="font-mono" x="52.5" y="82" text-anchor="middle" font-size="7.5" font-weight="800" fill="#e9d5ff">PRIMARY STACK</text>
  </g>

  <!-- STAGE 8: AZURE (PRIMARY) -->
  <g transform="translate(835, 55)">
    <rect x="0" y="0" width="95" height="90" rx="8" fill="url(#card-holo)" stroke="#0284c7" stroke-width="1.8" filter="url(#wf-glow)"/>
    <circle cx="47.5" cy="22" r="14" fill="#04152c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="47.5" y="26" text-anchor="middle" font-size="12">☁️</text>
    <text class="font-sans" x="47.5" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">AZURE</text>
    <text class="font-mono" x="47.5" y="67" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7dd3fc">Cloud Infra</text>
    <rect x="6" y="73" width="83" height="12" rx="3" fill="#0284c7" fill-opacity="0.3"/>
    <text class="font-mono" x="47.5" y="82" text-anchor="middle" font-size="7.5" font-weight="800" fill="#7dd3fc">PRIMARY STACK</text>
  </g>

  <!-- STAGE 9: DEPLOY -->
  <g transform="translate(945, 55)">
    <rect x="0" y="0" width="95" height="90" rx="8" fill="url(#card-holo)" stroke="#10b981" stroke-width="1"/>
    <circle cx="47.5" cy="22" r="14" fill="#04152c" stroke="#10b981" stroke-width="1"/>
    <text x="47.5" y="26" text-anchor="middle" font-size="12">🚀</text>
    <text class="font-sans" x="47.5" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">DEPLOY</text>
    <text class="font-mono" x="47.5" y="67" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6ee7b7">Zero-Downtime</text>
    <rect x="12" y="73" width="71" height="12" rx="3" fill="#10b981" fill-opacity="0.25"/>
    <text class="font-mono" x="47.5" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6ee7b7">RELEASE</text>
  </g>

  <!-- STAGE 10: MONITOR -->
  <g transform="translate(1050, 55)">
    <rect x="0" y="0" width="95" height="90" rx="8" fill="url(#card-holo)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="47.5" cy="22" r="14" fill="#04152c" stroke="#38bdf8" stroke-width="1"/>
    <text x="47.5" y="26" text-anchor="middle" font-size="12">📡</text>
    <text class="font-sans" x="47.5" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">MONITOR</text>
    <text class="font-mono" x="47.5" y="67" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7dd3fc">Azure Monitor</text>
    <rect x="12" y="73" width="71" height="12" rx="3" fill="#38bdf8" fill-opacity="0.25"/>
    <text class="font-mono" x="47.5" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#7dd3fc">TELEMETRY</text>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(24, 185)">
    <circle cx="6" cy="5" r="4" fill="#a855f7"/>
    <text class="font-mono" x="16" y="8" font-size="9" font-weight="700" fill="#e9d5ff">PRIMARY SPECIALIZATION: Microsoft Azure &amp; Terraform</text>

    <circle cx="420" cy="5" r="4" fill="#f59e0b"/>
    <text class="font-mono" x="430" y="8" font-size="9" font-weight="600" fill="#fcd34d">ADDITIONAL KNOWLEDGE: Docker &amp; Kubernetes (AKS)</text>

    <circle cx="820" cy="5" r="4" fill="#10b981"/>
    <text class="font-mono" x="830" y="8" font-size="9" font-weight="600" fill="#6ee7b7">CONTINUOUS SECURITY &amp; MONITORING</text>
  </g>
</svg>

